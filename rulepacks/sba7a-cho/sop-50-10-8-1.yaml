  - id: CON-07
    title: "Limited-source arithmetic: for lender review"
    description: "Limited-source arithmetic: for lender review. Evidence preparation check for lender review."
    scope: deal
    applies_when: true
    accepts: []
    required: true
    severity: major
    responsible: broker
    checks:
      - type: arithmetic
        message: "Combined limited sources compared with half of 10% of project cost: for lender review"
        expr:
          op: <=
          args:
            - op: sum
              args:
                - profile: equity_sources[].amount
                  kinds:
                    - seller_standby_note
                    - other_standby_debt
                    - minority_investor_equity
            - op: "*"
              args:
                - profile: total_project_cost
                - param: limited_fraction
    source_ref:
      class: sop
      citation: SOP 50 10 8.1, Appendix 15 C, Limited Equity Injection Sources (C begins p.350); fixed 10% baseline is the
        AcqFile seed convention. Pagination is the section-start page in the official DOCX table of contents; see
        docs/RULE_SOURCES.md.
      url: https://legacy.sba.gov/sites/default/files/2026-08/SOP%2050%2010%208.1%20effective%2010.1.2026_0.docx
    verified: false
    finding_type: conflict
