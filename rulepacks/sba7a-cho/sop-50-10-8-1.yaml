pack: sba7a-cho
version: sop-50-10-8-1
effective:
  loan_number_on_or_after: 2026-10-01
verified: false
parameters:
  interim_days: 120
  pfs_days: 90
  irs_days: 120
  money_tolerance: 1
  percent_tolerance: 0.01
  cash_tolerance: 1
  revenue_fraction: 0.01
  consulting_months: 24
  qoe_threshold: 3000000
  limited_fraction: 0.05
  lease_years: 10
  form_1919_revision: 02/2025
  price_tolerance: 0
index:
  folders:
    - Transaction
    - Buyer
    - Guarantors
    - Target
    - Lender
  filename_template: "{item_id}_{doc_label}_{party}_{period}{original_extension}"
items:
  - id: TXN-01
    title: Signed letter of intent
    description: Signed letter of intent. Evidence preparation check for lender review.
    scope: deal
    applies_when: true
    accepts:
      - LOI
    required: true
    severity: major
    responsible: broker
    checks:
      - type: presence
        message: Required evidence and named facts are present
        facts: []
      - type: signed_and_dated
        message: Signature and date are present
        signed_only: false
      - type: fact_comparison
        message: Both parties signed
        expr:
          op: ==
          args:
            - fact: deal.signed_by_both
            - true
      - type: date_order
        message: Letter of intent has not expired
        expr:
          op: ">="
          args:
            - fact: deal.expiry_date
            - as_of: true
    source_ref:
      class: lender_convention
      citation: "AcqFile synthetic seed convention (SPEC Section 13; unverified): Signed letter of intent"
    verified: false
  - id: TXN-02
    title: Purchase agreement with allocation
    description: Purchase agreement with allocation. Evidence preparation check for lender review.
    scope: deal
    applies_when: true
    accepts:
      - PURCHASE_AGREEMENT
    required: true
    severity: major
    responsible: buyer attorney
    checks:
      - type: presence
        message: Required evidence and named facts are present
        facts: []
      - type: fact_agreement
        message: Buyer and seller names match the deal parties
        mode: buyer_seller
      - type: fact_comparison
        message: Allocation table is present
        expr:
          op: ==
          args:
            - fact: deal.allocation_present
            - true
      - type: page_completeness
        message: Page X of Y agrees with the supplied page range
    source_ref:
      class: secondary
      citation: "Pioneer Capital Advisory, The Complete SBA Documentation Checklist for Business Buyers, 2025-12-04: Detailed
        Purchase Agreement"
      url: https://www.pioneercapitaladvisory.com/post/the-complete-sba-documentation-checklist-for-business-buyers
    verified: false
  - id: TXN-03
    title: Sources and uses
    description: Sources and uses. Evidence preparation check for lender review.
    scope: deal
    applies_when: true
    accepts:
      - SOURCES_USES
    required: true
    severity: major
    responsible: broker
    checks:
      - type: presence
        message: Required evidence and named facts are present
        facts:
          - funding.sources
          - funding.uses
          - funding.sources_total
          - funding.uses_total
      - type: arithmetic
        message: Sources and uses total correctly
        expr:
          op: and
          args:
            - op: ==
              args:
                - op: sum
                  args:
                    - fact: funding.sources
                      field: amount
                - fact: funding.sources_total
            - op: ==
              args:
                - op: sum
                  args:
                    - fact: funding.uses
                      field: amount
                - fact: funding.uses_total
            - op: ==
              args:
                - fact: funding.sources_total
                - fact: funding.uses_total
        tolerance_param: money_tolerance
    source_ref:
      class: lender_convention
      citation: "AcqFile synthetic seed convention (SPEC Section 13; unverified): Sources and uses"
    verified: false
  - id: TXN-04
    title: Seller note or term sheet
    description: Seller note or term sheet. Evidence preparation check for lender review.
    scope: deal
    applies_when:
      op: ==
      args:
        - profile: seller_note.present
        - yes
    accepts:
      - SELLER_NOTE
    required: true
    severity: major
    responsible: seller
    checks:
      - type: presence
        message: Required evidence and named facts are present
        facts:
          - note.principal
          - note.term_months
          - note.full_standby
    source_ref:
      class: lender_convention
      citation: "AcqFile synthetic seed convention (SPEC Section 13; unverified): Seller note or term sheet"
    verified: false
  - id: TXN-05
    title: Standby agreement
    description: Standby agreement. Evidence preparation check for lender review.
    scope: deal
    applies_when:
      op: and
      args:
        - op: ==
          args:
            - profile: seller_note.present
            - yes
        - op: ==
          args:
            - profile: seller_note.counted_toward_injection
            - yes
    accepts:
      - SBA_155
    required: true
    severity: major
    responsible: lender
    checks:
      - type: tracking
        message: Lender-ordered item received
    source_ref:
      class: sop
      citation: SOP 50 10 8.1, Appendix 15 C, Source of Equity Injections (C begins p.350). Pagination is the section-start
        page in the official DOCX table of contents; see docs/RULE_SOURCES.md.
      url: https://legacy.sba.gov/sites/default/files/2026-08/SOP%2050%2010%208.1%20effective%2010.1.2026_0.docx
    verified: false
  - id: TXN-06
    title: Seller consulting or transition agreement
    description: Seller consulting or transition agreement. Evidence preparation check for lender review.
    scope: deal
    applies_when:
      op: ==
      args:
        - profile: seller_staying.present
        - yes
    accepts:
      - CONSULTING_AGREEMENT
    required: true
    severity: major
    responsible: seller
    checks:
      - type: presence
        message: Required evidence and named facts are present
        facts:
          - consulting.term_months
    source_ref:
      class: lender_convention
      citation: "AcqFile synthetic seed convention (SPEC Section 13; unverified): Seller consulting or transition agreement"
    verified: false
  - id: TXN-07
    title: SBA Form 159 for paid agent
    description: SBA Form 159 for paid agent. Evidence preparation check for lender review.
    scope: per_paid_agent
    applies_when: true
    accepts:
      - SBA_159
    required: true
    severity: major
    responsible: broker
    checks:
      - type: signed_and_dated
        message: Signature and date are present
        signed_only: false
      - type: fact_comparison
        message: Agent and applicant signatures are present
        expr:
          op: ==
          args:
            - fact: agent.both_signed
            - true
    source_ref:
      class: sba_form
      citation: SBA Form 159 (08-21), page 3, applicant and agent signature/date blocks; this citation does not assert the
        current form revision.
      url: https://legacy.sba.gov/sites/default/files/2022-02/SBA%20Form%20159_2.10.22-508_0.pdf
    verified: false
  - id: TXN-08
    title: Independent business valuation
    description: Independent business valuation. Evidence preparation check for lender review.
    scope: deal
    applies_when: true
    accepts:
      - VALUATION
    required: true
    severity: major
    responsible: lender
    checks:
      - type: tracking
        message: Lender-ordered item received
    source_ref:
      class: sop
      citation: SOP 50 10 8.1, Appendix 15 C.1.a, Business Valuation Requirements (C begins p.350). Pagination is the
        section-start page in the official DOCX table of contents; see docs/RULE_SOURCES.md.
      url: https://legacy.sba.gov/sites/default/files/2026-08/SOP%2050%2010%208.1%20effective%2010.1.2026_0.docx
    verified: false
  - id: TXN-09
    title: Quality of earnings report
    description: Quality of earnings report. Evidence preparation check for lender review.
    scope: deal
    applies_when:
      op: and
      args:
        - op: in
          args:
            - profile: transaction_category
            - - initial_acquisition
              - business_expansion
        - op: ">="
          args:
            - profile: purchase_price
            - param: qoe_threshold
    accepts:
      - QOE
    required: true
    severity: major
    responsible: lender
    checks:
      - type: tracking
        message: Lender-ordered item received
    source_ref:
      class: sop
      citation: SOP 50 10 8.1, Appendix 15 C.1.b, Quality of Earnings (C begins p.350). Pagination is the section-start page
        in the official DOCX table of contents; see docs/RULE_SOURCES.md.
      url: https://legacy.sba.gov/sites/default/files/2026-08/SOP%2050%2010%208.1%20effective%2010.1.2026_0.docx
    verified: false
  - id: ENT-01
    title: SBA Form 1919
    description: SBA Form 1919. Evidence preparation check for lender review.
    scope: buyer_entity
    applies_when: true
    accepts:
      - SBA_1919
    required: true
    severity: blocker
    responsible: buyer
    checks:
      - type: presence
        message: Required evidence and named facts are present
        facts: []
      - type: form_revision
        message: Configured form revision is present
        revision_param: form_1919_revision
      - type: signed_and_dated
        message: Signature and date are present
        signed_only: false
      - type: fact_agreement
        message: Ownership totals 100 and every declared owner is listed
        fact: ownership.members
        mode: owners
        across:
          - SBA_1919
        tolerance_param: percent_tolerance
    source_ref:
      class: secondary
      citation: "StatementsReady, How to Fill Out SBA Form 1919: revision 02/2025 and owner entries; the 100% ownership total
        and every-owner comparison are AcqFile seed conventions, stronger than the form’s minimum listing coverage."
      url: https://statementsready.com/blog/how-to-fill-out-sba-form-1919
    verified: false
