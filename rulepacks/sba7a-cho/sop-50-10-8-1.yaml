consistency:
  - id: CON-01
    title: Seller identity agrees
    description: Seller identity agrees. Evidence preparation check for lender review.
    scope: target_business
    applies_when: true
    accepts:
      - TAX_BUSINESS
      - PURCHASE_AGREEMENT
      - IRS_4506C
    required: true
    severity: blocker
    responsible: broker
    checks:
      - type: fact_agreement
        message: Values agree across the named sources
        fact: party.legal_name
        across:
          - TAX_BUSINESS
          - PURCHASE_AGREEMENT
          - IRS_4506C
      - type: fact_agreement
        message: Values agree across the named sources
        fact: party.identifier
        across:
          - TAX_BUSINESS
          - PURCHASE_AGREEMENT
          - IRS_4506C
    source_ref:
      class: internal_consistency
      citation: "AcqFile SPEC Section 13: internal consistency comparison; no lending determination."
    verified: false
    finding_type: conflict
  - id: CON-02
    title: Ownership agrees and totals 100
    description: Ownership agrees and totals 100. Evidence preparation check for lender review.
    scope: buyer_entity
    applies_when: true
    accepts:
      - SBA_1919
      - OPERATING_AGREEMENT
      - OWNERSHIP_CHART
    required: true
    severity: blocker
    responsible: broker
    checks:
      - type: fact_agreement
