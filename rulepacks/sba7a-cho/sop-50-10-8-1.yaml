    applies_when:
      op: ==
      args:
        - profile: seller_note.present
        - yes
    accepts:
      - LOI
      - PURCHASE_AGREEMENT
      - SELLER_NOTE
      - SOURCES_USES
    required: true
    severity: major
    responsible: broker
    checks:
      - type: fact_agreement
        message: Values agree across the named sources
        fact: deal.seller_note_amount
        across:
          - LOI
          - PURCHASE_AGREEMENT
          - SOURCES_USES
        tolerance_param: money_tolerance
      - type: arithmetic
        message: Note principal equals the stated amount
        expr:
          op: ==
          args:
            - fact: note.principal
              types:
