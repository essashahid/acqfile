            - fact: deal.seller_note_amount
              types:
                - PURCHASE_AGREEMENT
        tolerance_param: money_tolerance
      - type: fact_agreement
        message: Values agree across the named sources
        fact: deal.seller_note_terms
        across:
          - LOI
          - PURCHASE_AGREEMENT
          - SELLER_NOTE
          - SOURCES_USES
