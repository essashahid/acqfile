  - id: GUA-01
    title: Personal financial statement
    description: Personal financial statement. Evidence preparation check for lender review.
    scope: per_guarantor
    applies_when: true
    accepts:
      - SBA_413
    required: true
    severity: blocker
    responsible: buyer
    checks:
      - type: presence
        message: Required evidence and named facts are present
        facts: []
      - type: freshness
        message: Date is within the configured window
        fact: pfs.as_of_date
        max_age_param: pfs_days
      - type: signed_and_dated
        message: Signature and date are present
        signed_only: false
      - type: arithmetic
        message: Assets less liabilities equal net worth
        expr:
          op: ==
          args:
            - op: "-"
              args:
                - fact: pfs.total_assets
                - fact: pfs.total_liabilities
            - fact: pfs.net_worth
        tolerance_param: money_tolerance
    source_ref:
      class: sop
      citation: SOP 50 10 8.1, Appendix 20, Owner Financial Statement (Appendix begins p.390). Pagination is the section-start
        page in the official DOCX table of contents; see docs/RULE_SOURCES.md.
